name: Sync Fork with Upstream
on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/esphome/esphome

      - name: Fetch Upstream Changes
        run: git fetch upstream

      - name: Merge Changes and Push
        run: |
          git checkout fix_rc5_recv
          git merge upstream/dev
          git push origin fix_rc5_recv
          git checkout esp32_soft_rmt
          git merge upstream/dev
          git push origin esp32_soft_rmt
          git checkout udp_broadcast
          git merge upstream/dev
          git push origin udp_broadcast
          git checkout mymaster
          git merge upstream/dev fix_rc5_recv esp32_soft_rmt udp_broadcast
          git push origin mymaster
