name: Sync Fork with Upstream
on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/esphome/esphome

      - name: Fetch Upstream Changes
        run: git fetch upstream

      - name: Merge Changes and Push
        run: |
          git checkout origin/fix_rc5_recv
          git merge upstream/dev
          git push origin fix_rc5_recv
          git checkout origin/esp32_soft_rmt
          git merge upstream/dev
          git push origin esp32_soft_rmt
          git checkout origin/udp_broadcast
          git merge upstream/dev
          git push origin udp_broadcast
          git checkout origin/mymaster
          git merge upstream/dev origin/fix_rc5_recv origin/esp32_soft_rmt origin/udp_broadcast
          git push origin mymaster
